[package]
name = "presence-firmware"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "presence-firmware"
path = "src/main.rs"
test = false

[dependencies]
presence-core = { path = "../core" }

# HAL and runtime
esp-hal = { version = "=1.2.2", features = ["defmt", "esp32c3", "unstable"] }
esp-rtos = { version = "=0.4.0", features = [
	"defmt",
	"embassy",
	"esp-alloc",
	"esp-radio",
	"esp32c3",
] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["defmt", "esp32c3"] }
esp-alloc = { version = "=0.11.0", features = ["defmt", "esp32c3"] }

# BLE: esp-radio's controller, driven with raw HCI commands
esp-radio = { version = "=1.0.0-beta.1", features = [
	"ble",
	"defmt",
	"esp-alloc",
	"esp32c3",
	"unstable",
] }
bt-hci = { version = "0.9.0", features = ["defmt"] }

# Sensor
ld2410s = { git = "https://github.com/mvdschee/ld2410s.git", tag = "v0.2.1", features = [
	"async",
] }

# Async
embassy-executor = { version = "=0.10.0", features = ["defmt"] }
embassy-futures = "0.1.2"
embassy-sync = "0.8.0"
embassy-time = { version = "=0.5.1", features = ["defmt"] }

# Logging over RTT
defmt = "1.2.0"
rtt-target = { version = "0.6.2", features = ["defmt"] }
panic-rtt-target = { version = "0.2.0", features = ["defmt"] }

[lints.rust]
unsafe_code = "forbid"
